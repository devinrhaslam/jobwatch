# Render Blueprint: provisions the whole stack from this repo. In the Render
# dashboard, New → Blueprint → pick this repo, and Render creates everything
# below. Values marked `sync: false` are filled in once (see DEPLOY.md).
#
# Free tier is fine to validate the deploy, with two caveats: free web services
# sleep after inactivity (cold starts), and free Postgres is deleted after 30
# days. Upgrade the plans before relying on it.

databases:
  - name: jobwatch-db
    plan: free
    postgresMajorVersion: "16"

services:
  # Go API.
  - type: web
    name: jobwatch-backend
    runtime: go
    rootDir: backend
    plan: free
    buildCommand: go build -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /health
    envVars:
      - key: JOBWATCH_DATABASE_URL
        fromDatabase:
          name: jobwatch-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JOBWATCH_APP_URL # the frontend URL, for magic-link emails
        sync: false
      - key: JOBWATCH_API_URL # this service's own URL, for links inside email
        sync: false
      - key: JOBWATCH_ALLOWED_ORIGIN # the frontend URL, for CORS
        sync: false
      # Signs the click/open/unsubscribe links. MUST match jobwatch-nightly's
      # value: the cron mints these links and this service verifies them. Unset
      # disables click tracking rather than shipping an unsigned open redirect.
      - key: JOBWATCH_LINK_SECRET
        sync: false
      - key: JOBWATCH_POSTAL_ADDRESS # CAN-SPAM: printed in every digest footer
        sync: false
      - key: RESEND_API_KEY # send real email; unset falls back to the dev logger
        sync: false
      - key: RESEND_FROM # verified sender, e.g. "jobwatch <alerts@yourdomain.com>"
        sync: false

  # React static site. VITE_API_BASE is baked in at build time, so a change needs
  # a redeploy. The SPA rewrite lets deep links like /verify?token=… load.
  - type: web
    name: jobwatch-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE # the backend URL, e.g. https://jobwatch-backend.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # One nightly job (22:00 UTC ≈ early evening US): scrape into Postgres, then
  # enrich the new postings (role, level, location) and send the digests —
  # sequentially in one run, so there is no timing gap between two crons. Docker, because Playwright needs
  # browsers and the image also carries the Go digest binary (see Dockerfile.cron).
  - type: cron
    name: jobwatch-nightly
    runtime: docker
    dockerfilePath: ./Dockerfile.cron
    dockerContext: .
    schedule: "0 22 * * *"
    envVars:
      - key: JOBWATCH_DATABASE_URL
        fromDatabase:
          name: jobwatch-db
          property: connectionString
      # Meta/Tesla/Revolut need a headless browser and bot-block datacenter IPs;
      # skip them here so a browser can't hang the run.
      - key: JOBWATCH_SKIP_BROWSER
        value: "1"
      # A few flaky sites among hundreds shouldn't fail the whole run; per-company
      # failures are visible in the backend's /health instead.
      - key: JOBWATCH_TOLERATE_FAILURES
        value: "1"
      - key: ANTHROPIC_API_KEY # enrichment: role, level, and location per posting
        sync: false
      - key: RESEND_API_KEY # send digests; unset falls back to the dev logger
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: JOBWATCH_APP_URL # for the digest's preferences link
        sync: false
      - key: JOBWATCH_API_URL # for the digest's tracked and unsubscribe links
        sync: false
      # Must be byte-identical to jobwatch-backend's, or every link this cron
      # puts in an email fails signature verification when someone clicks it.
      - key: JOBWATCH_LINK_SECRET
        sync: false
      - key: JOBWATCH_POSTAL_ADDRESS # CAN-SPAM: printed in every digest footer
        sync: false
