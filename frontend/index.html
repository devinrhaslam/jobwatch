<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jobwatch — every software job, the day it's posted</title>
    <meta
      name="description"
      content="Daily email alerts for new software engineering roles at 267 top companies, read straight from their career pages. A role is new the first time we see it."
    />
    <!-- Tells the browser both palettes are supported, so form controls and
         scrollbars match the theme rather than staying stubbornly light. -->
    <meta name="color-scheme" content="light dark" />

    <!-- The preview card is what decides the click-through rate when this link
         is posted to Reddit or Hacker News, which is the entire launch plan. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="jobwatch — every software job, the day it's posted" />
    <meta
      property="og:description"
      content="Daily email alerts for new software engineering roles at 267 top companies, read straight from their career pages."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="jobwatch — every software job, the day it's posted" />
    <meta
      name="twitter:description"
      content="Daily email alerts for new software engineering roles at 267 top companies."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
